apiVersion: v1
kind: Secret
metadata:
  name: app-env-secret
  namespace: prod
type: Opaque
stringData:
  DATABASE_URL: postgresql://library:library@postgres:5432/library_lending
  REDIS_URL: redis://redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-lending
  namespace: prod
  labels:
    app: library-lending
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-lending
  template:
    metadata:
      labels:
        app: library-lending
    spec:
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: library-lending
          image: varsha198/library-lending-python:prod
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-env-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-env-secret
                  key: REDIS_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: library-lending
  namespace: prod
  labels:
    app: library-lending
spec:
  type: NodePort
  selector:
    app: library-lending
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082
