apiVersion: v1
kind: Pod
metadata:
  name: library-lending-pod
  labels:
    app: library-lending-pod
spec:
  imagePullSecrets:
    - name: dockerhub
  containers:
    - name: library-lending
      image: varsha198/library-lending-python:qa
      imagePullPolicy: Always
      ports:
        - containerPort: 8080
      env:
        - name: DATABASE_URL
          value: "postgresql://library:library@db:5432/library_lending"
        - name: REDIS_URL
          value: "redis://cache:6379/0"
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"
        requests:
          memory: "64Mi"
          cpu: "100m"
