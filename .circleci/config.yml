version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo

jobs:
  secret-scan:
    docker:
      - image: cimg/base:current
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install Gitleaks
          command: |
            GITLEAKS_VERSION="8.18.2"
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp
            sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - run:
          name: Run Gitleaks Secret Scan
          command: gitleaks detect --source . --verbose --no-git

  lint:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install Ruff
          command: pip install ruff==0.4.8
      - run:
          name: Run Ruff Linter
          command: ruff check .

  unit-tests:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Install Dependencies and pytest
          command: |
            pip install -r requirements.txt
            pip install pytest==8.2.2 pytest-cov==5.0.0 httpx==0.27.0
      - run:
          name: Run Unit Tests with Coverage
          command: pytest tests/test_fines.py tests/test_main.py --cov=app --cov-report=term-missing --cov-fail-under=70

  integration-tests:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:16.2
        environment:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library_lending
      - image: cimg/redis:7.2
    environment:
      DATABASE_URL: postgresql://library:library@localhost:5432/library_lending
      REDIS_URL: redis://localhost:6379/0
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Install System Tools & Dependencies
          command: |
            sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools
            pip install -r requirements.txt
            pip install pytest==8.2.2 pytest-cov==5.0.0 httpx==0.27.0
      - run:
          name: Wait for Postgres & Redis
          command: |
            echo "Waiting for Postgres..."
            until pg_isready -h localhost -U library -d library_lending; do
              sleep 1
            done
            echo "Waiting for Redis..."
            until redis-cli -h localhost ping | grep PONG; do
              sleep 1
            done
            echo "Services ready."
      - run:
          name: Apply Database Migrations
          command: |
            for f in migrations/*.sql; do
              echo "Applying $f..."
              PGPASSWORD=library psql -h localhost -U library -d library_lending -f "$f"
            done
      - run:
          name: Run Integration Tests
          command: pytest tests/test_integration.py --cov=app --cov-report=term-missing

  build-and-push:
    parameters:
      moving_tag:
        type: string
      immutable_prefix:
        type: string
    docker:
      - image: cimg/base:current
    working_directory: ~/repo
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and Push Docker Image with Moving and Immutable Tags
          command: |
            DH_USER="${DOCKERHUB_USER:-$DOCKERHUB_USERNAME}"
            DH_TOKEN="${DOCKERHUB_TOKEN:-$DOCKERHUB_PASSWORD}"
            REPO_NAME="${DOCKERHUB_REPO:-library-lending-python}"

            if [ -z "$DH_USER" ]; then
              echo "WARNING: DOCKERHUB_USER not set. Defaulting to 'library' for build verification."
              DH_USER="library"
            fi

            SHORT_SHA=$(echo "$CIRCLE_SHA1" | cut -c1-7)
            MOVING_IMAGE="${DH_USER}/${REPO_NAME}:<< parameters.moving_tag >>"
            IMMUTABLE_IMAGE="${DH_USER}/${REPO_NAME}:<< parameters.immutable_prefix >>-${SHORT_SHA}"

            echo "Building image: $MOVING_IMAGE and $IMMUTABLE_IMAGE"
            docker build -t "$MOVING_IMAGE" -t "$IMMUTABLE_IMAGE" .

            if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ] && [ "$DH_USER" != "library" ]; then
              echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
              docker push "$MOVING_IMAGE"
              docker push "$IMMUTABLE_IMAGE"
              echo "Successfully pushed both $MOVING_IMAGE and $IMMUTABLE_IMAGE"
            else
              echo "Docker Hub credentials not configured or using default user; skipping push."
              echo "Configure DOCKERHUB_USER and DOCKERHUB_TOKEN in CircleCI Project Settings to enable push."
            fi

workflows:
  main-qa-pipeline:
    jobs:
      - secret-scan:
          filters:
            branches:
              only: main
      - lint:
          requires:
            - secret-scan
          filters:
            branches:
              only: main
      - unit-tests:
          requires:
            - lint
          filters:
            branches:
              only: main
      - integration-tests:
          requires:
            - unit-tests
          filters:
            branches:
              only: main
      - build-and-push:
          name: build-and-push-qa
          moving_tag: "qa"
          immutable_prefix: "qa"
          requires:
            - integration-tests
          filters:
            branches:
              only: main

  staging-pipeline:
    jobs:
      - build-and-push:
          name: build-and-push-stage
          moving_tag: "stage"
          immutable_prefix: "staging"
          filters:
            branches:
              only: staging

  prod-pipeline:
    jobs:
      - build-and-push:
          name: build-and-push-prod
          moving_tag: "prod"
          immutable_prefix: "prod"
          filters:
            branches:
              only: prod

  feature-branch-pipeline:
    jobs:
      - secret-scan:
          filters:
            branches:
              only: /feature\/.*/
      - lint:
          requires:
            - secret-scan
          filters:
            branches:
              only: /feature\/.*/
      - unit-tests:
          requires:
            - lint
          filters:
            branches:
              only: /feature\/.*/
      - integration-tests:
          requires:
            - unit-tests
          filters:
            branches:
              only: /feature\/.*/
